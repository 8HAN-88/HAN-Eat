name: han_eat
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  json_annotation: ^4.9.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  record: ^6.1.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.3.0
  video_player: ^2.9.1
  chewie: ^1.7.4
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.1.0
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^20.0.0
  connectivity_plus: ^7.0.0
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.4.0
  http: ^1.6.0
  flutter_dotenv: ^5.0.2
  flutter_riverpod: ^2.3.6
  go_router: ^13.0.0
  timezone: ^0.10.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  flutter_inappwebview: ^6.1.5
  flutter_webrtc: ^1.5.2
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  js: ^0.7.1
  share_plus: ^10.1.2
  visibility_detector: ^0.4.0+2
  app_links: ^6.3.2
  flutter_web_auth_2: ^4.1.0
  google_fonts: ^6.2.1
  flutter_contacts: ^2.1.0
  flutter_slidable: ^4.0.3
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont.ttf
  assets:
    - assets/app_icon_source.png
    - assets/brand_logo.png
    - assets/fonts/
  # Секреты не включаем в assets (релиз). Локально: --dart-define или .env через flutter_dotenv
  # только если добавите .env в assets вручную для dev.
