<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="HAN Eat — рецепты, лента, каналы и meal plan">
  <meta name="theme-color" content="#0F1319">

  <!-- PWA / Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HAN Eat">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HAN Eat</title>
  <link rel="preconnect" href="https://api.haneat.app" crossorigin>
  <link rel="dns-prefetch" href="https://api.haneat.app">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0F1319;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1319;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      color: #F7F8FA;
    }
    #boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8E8E4;
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    flt-scene-host, flt-glass-pane {
      background-color: #0F1319;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div style="font-weight:700;font-size:18px">HAN Eat</div>
  </div>
  <script>
    (function () {
      var SCHEMA = 3;
      var SCHEMA_KEY = 'haneat_web_schema';
      var KEY = 'haneat_web_build_v3';
      var LEGACY_KEYS = ['haneat_web_build_v2', 'haneat_web_build'];
      var flutterStarted = false;
      var VERSION_TIMEOUT_MS = 5000;
      var RELOAD_GUARD_KEY = 'haneat_web_reload_guard';

      function storageGet(kind, key) {
        try {
          return kind.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function storageSet(kind, key, value) {
        try {
          kind.setItem(key, value);
          return true;
        } catch (e) {
          return false;
        }
      }

      function unregisterServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
      }

      function loadFlutter(build) {
        if (flutterStarted) return;
        flutterStarted = true;
        var start = function () {
          var s = document.createElement('script');
          s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(build || Date.now());
          s.async = true;
          document.body.appendChild(s);
        };
        unregisterServiceWorkers().finally(start);
      }

      function clearCachesAndReload(build) {
        if (storageGet(sessionStorage, RELOAD_GUARD_KEY) === build) {
          loadFlutter(build);
          return;
        }
        storageSet(sessionStorage, RELOAD_GUARD_KEY, build);
        storageSet(localStorage, KEY, build);
        storageSet(localStorage, SCHEMA_KEY, String(SCHEMA));
        LEGACY_KEYS.forEach(function (k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
        var tasks = [unregisterServiceWorkers()];
        if (window.caches && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          );
        }
        Promise.all(tasks).finally(function () {
          var url = new URL(location.href);
          url.searchParams.set('v', build);
          url.searchParams.set('_cb', String(Date.now()));
          location.replace(url.toString());
        });
      }

      function shouldForceReload(build) {
        if (storageGet(sessionStorage, RELOAD_GUARD_KEY) === build) return false;
        if (storageGet(localStorage, SCHEMA_KEY) !== String(SCHEMA)) return true;
        for (var i = 0; i < LEGACY_KEYS.length; i++) {
          if (storageGet(localStorage, LEGACY_KEYS[i])) return true;
        }
        var prev = storageGet(localStorage, KEY);
        return !!(prev && prev !== build);
      }

      function startWithBuild(build) {
        if (!build) {
          loadFlutter(storageGet(localStorage, KEY) || String(Date.now()));
          return;
        }
        if (shouldForceReload(build)) {
          clearCachesAndReload(build);
          return;
        }
        storageSet(localStorage, KEY, build);
        storageSet(localStorage, SCHEMA_KEY, String(SCHEMA));
        try { sessionStorage.removeItem(RELOAD_GUARD_KEY); } catch (e) {}
        loadFlutter(build);
      }

      var versionTimer = setTimeout(function () {
        startWithBuild(localStorage.getItem(KEY) || '');
      }, VERSION_TIMEOUT_MS);

      fetch('/version.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          clearTimeout(versionTimer);
          var build = String(v.build_number || v.version || '');
          startWithBuild(build);
        })
        .catch(function () {
          clearTimeout(versionTimer);
          startWithBuild(localStorage.getItem(KEY) || '');
        });
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('boot-splash');
      if (s) s.remove();
    });
  </script>
</body>
</html>
