<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="HAN Eat — рецепты, лента, каналы и meal plan">
  <meta name="theme-color" content="#F7F8FA">

  <!-- PWA / Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HAN Eat">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HAN Eat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #F7F8FA;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F7F8FA;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1A1A1A;
    }
    #boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8E8E4;
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    flt-scene-host, flt-glass-pane {
      background-color: #F7F8FA;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div style="font-weight:700;font-size:18px">HAN Eat</div>
    <div id="boot-status" style="font-size:13px;opacity:0.6;margin-top:6px">Загрузка…</div>
  </div>
  <script>
    (function () {
      var KEY = 'haneat_web_build';
      var statusEl = document.getElementById('boot-status');

      function loadFlutter() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      function clearCachesAndReload(build) {
        if (statusEl) statusEl.textContent = 'Обновление…';
        localStorage.setItem(KEY, build);
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
          );
        }
        if (window.caches && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          );
        }
        Promise.all(tasks).finally(function () {
          location.replace(location.pathname + '?v=' + build);
        });
      }

      fetch('/version.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          var build = String(v.build_number || v.version || '');
          if (!build) {
            loadFlutter();
            return;
          }
          var prev = localStorage.getItem(KEY);
          if (prev && prev !== build) {
            clearCachesAndReload(build);
            return;
          }
          localStorage.setItem(KEY, build);
          loadFlutter();
        })
        .catch(function () {
          loadFlutter();
        });
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('boot-splash');
      if (s) s.remove();
    });
  </script>
</body>
</html>
