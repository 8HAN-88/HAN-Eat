<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided by `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="HAN Eat — рецепты, лента, каналы и meal plan">
  <meta name="theme-color" content="#0F1319">
  <meta name="han-eat-build" content="__HAN_BUILD_ID__">

  <!-- PWA / Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HAN Eat">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HAN Eat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0F1319 !important;
      color: #F7F8FA;
    }
    #app-underlay {
      position: fixed;
      inset: 0;
      background: #0F1319;
      z-index: 0;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1319;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      color: #F7F8FA;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      opacity: 1;
      transition: opacity 220ms ease;
    }
    #boot-splash.is-hiding {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8E8E4;
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    flt-scene-host, flt-glass-pane, flutter-view, flt-renderer, canvas {
      background-color: #0F1319 !important;
    }
  </style>
  <!-- Boot Flutter as early as possible; do not gate on version.json / SW. -->
  <script>
    (function () {
      // Visible in nginx access.log — proves inline JS executed on device.
      try {
        new Image().src = '/boot-ping?b=__HAN_BUILD_ID__&t=' + Date.now();
      } catch (e) {}

      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register = function () {
            return Promise.reject(new Error('HAN Eat: service worker disabled'));
          };
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              try { regs[i].unregister(); } catch (err) {}
            }
          }).catch(function () {});
        }
      } catch (e) {}

      try {
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) {
              try { caches.delete(keys[i]); } catch (err) {}
            }
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js?v=__HAN_BUILD_ID__" async></script>
</head>
<body>
  <div id="app-underlay" aria-hidden="true"></div>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div style="font-weight:700;font-size:18px">HAN Eat</div>
  </div>
  <script>
    (function () {
      var firstFrame = false;
      var primaryUiReady = false;
      var splashHidden = false;
      var splash = document.getElementById('boot-splash');

      function maybeHideSplash() {
        if (splashHidden || !firstFrame || !primaryUiReady) return;
        splashHidden = true;
        setTimeout(function () {
          if (!splash) return;
          splash.classList.add('is-hiding');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.remove();
          }, 260);
        }, 400);
      }

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        maybeHideSplash();
      });

      window.addEventListener('han-primary-ui-ready', function () {
        primaryUiReady = true;
        maybeHideSplash();
      });

      setTimeout(function () {
        if (firstFrame && !primaryUiReady) {
          primaryUiReady = true;
          maybeHideSplash();
        }
      }, 2500);

      // Silent auto-recovery: if Flutter never paints, wipe stale SW/cache once.
      // No buttons — users just get the latest shell automatically.
      setTimeout(function () {
        if (firstFrame) return;
        if (/[?&]fresh=/.test(location.search)) return;
        try {
          if (sessionStorage.getItem('haneat_boot_fresh_once') === '1') return;
          sessionStorage.setItem('haneat_boot_fresh_once', '1');
        } catch (e) {}
        location.replace('/fresh');
      }, 16000);
    })();
  </script>
</body>
</html>
