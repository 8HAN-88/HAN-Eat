<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="HAN Eat — рецепты, лента, каналы и meal plan">
  <meta name="theme-color" content="#0F1319">

  <!-- PWA / Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HAN Eat">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HAN Eat</title>
  <link rel="preconnect" href="https://api.haneat.app" crossorigin>
  <link rel="dns-prefetch" href="https://api.haneat.app">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0F1319;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1319;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      color: #F7F8FA;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #boot-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8E8E4;
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    #boot-splash .hint {
      margin-top: 14px;
      color: #A8B0BB;
      font-size: 14px;
      line-height: 1.4;
      max-width: 280px;
      display: none;
    }
    #boot-splash .actions {
      margin-top: 18px;
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #boot-splash button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #2AABEE;
      color: #fff;
    }
    #boot-splash button.secondary {
      background: #243041;
      color: #F7F8FA;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    flt-scene-host, flt-glass-pane, flutter-view {
      background-color: #0F1319 !important;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="spinner" id="boot-spinner"></div>
    <div style="font-weight:700;font-size:18px">HAN Eat</div>
    <div class="hint" id="boot-hint">Загрузка занимает слишком долго. Можно обновить приложение и очистить кэш.</div>
    <div class="actions" id="boot-actions">
      <button type="button" id="boot-reload">Обновить</button>
      <button type="button" class="secondary" id="boot-recover">Очистить кэш</button>
    </div>
  </div>
  <script>
    (function () {
      // Older Safari/WebKit can fail before Flutter starts because generated
      // bootstrap code uses Promise.finally(). Polyfill it up front.
      if (typeof Promise !== 'undefined' && !Promise.prototype.finally) {
        Promise.prototype.finally = function (onFinally) {
          var P = this.constructor;
          var handler = typeof onFinally === 'function' ? onFinally : function () {};
          return this.then(
            function (value) {
              return P.resolve(handler()).then(function () { return value; });
            },
            function (reason) {
              return P.resolve(handler()).then(function () { throw reason; });
            }
          );
        };
      }

      var flutterStarted = false;
      var firstFrame = false;
      var primaryUiReady = false;
      var splash = document.getElementById('boot-splash');

      function maybeHideSplash() {
        if (!firstFrame || !primaryUiReady) return;
        setTimeout(function () {
          if (splash && splash.parentNode) splash.remove();
        }, 120);
      }

      function showRecovery() {
        if (firstFrame && primaryUiReady) return;
        var hint = document.getElementById('boot-hint');
        var actions = document.getElementById('boot-actions');
        var spinner = document.getElementById('boot-spinner');
        if (hint) hint.style.display = 'block';
        if (actions) actions.style.display = 'flex';
        if (spinner) spinner.style.display = 'none';
      }

      function clearClientCaches() {
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {})
          );
        }
        if (window.caches && caches.keys) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {})
          );
        }
        try {
          // Drop only HAN Eat flutter prefs that can brick boot; keep unrelated site data.
          Object.keys(localStorage || {}).forEach(function (key) {
            if (key.indexOf('flutter.') === 0) {
              // Keep auth tokens; clear volatile UI/cache keys that cause blank boots.
              if (
                key.indexOf('access_token') >= 0 ||
                key.indexOf('refresh_token') >= 0 ||
                key === 'flutter.user' ||
                key.indexOf('.user') >= 0 ||
                key.indexOf('current_user') >= 0 ||
                key.indexOf('user_json') >= 0
              ) {
                return;
              }
              localStorage.removeItem(key);
            }
          });
        } catch (e) {}
        return Promise.all(jobs);
      }

      function hardRecover() {
        var after = function () {
          var url = new URL(window.location.href);
          url.searchParams.set('recover', String(Date.now()));
          window.location.replace(url.toString());
        };
        clearClientCaches().then(after, after);
      }

      var reloadBtn = document.getElementById('boot-reload');
      var recoverBtn = document.getElementById('boot-recover');
      if (reloadBtn) reloadBtn.addEventListener('click', function () { window.location.reload(); });
      if (recoverBtn) recoverBtn.addEventListener('click', hardRecover);

      // Auto-recover once if previous boot failed.
      var hadRecoverParam = false;
      try {
        var params = new URLSearchParams(window.location.search);
        hadRecoverParam = params.has('recover');
        if (hadRecoverParam) {
          clearClientCaches();
        }
      } catch (e) {}

      function unregisterServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
      }

      function blockServiceWorkerRegistration() {
        if (!('serviceWorker' in navigator)) return;
        try {
          navigator.serviceWorker.register = function () {
            return Promise.reject(new Error('HAN Eat: service worker disabled'));
          };
          navigator.serviceWorker.getRegistration = function () {
            return Promise.resolve(undefined);
          };
        } catch (e) {}
      }

      function loadFlutter(build) {
        if (flutterStarted) return;
        flutterStarted = true;
        var start = function () {
          blockServiceWorkerRegistration();
          var s = document.createElement('script');
          s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(build || Date.now());
          s.async = true;
          s.onerror = function () { showRecovery(); };
          document.body.appendChild(s);
        };
        unregisterServiceWorkers().then(start, start);
      }

      fetch('/version.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          var build = String(v.build_number || v.version || Date.now());
          loadFlutter(build);
        })
        .catch(function () {
          loadFlutter(String(Date.now()));
        });

      // If Flutter never paints, don't leave users on an endless blank state.
      setTimeout(showRecovery, 10000);

      // If Flutter paints a frame but never reaches a usable login/shell screen,
      // keep the dark splash visible and offer recovery instead of exposing a
      // blank white canvas.
      setTimeout(function () {
        if (!primaryUiReady) showRecovery();
      }, 12000);

      // Do NOT auto hardRecover/reload. On Safari that produces a white page
      // and "server stopped responding" while large assets are still loading.
      // Recovery stays manual via the buttons above.

      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        maybeHideSplash();
      });

      window.addEventListener('han-primary-ui-ready', function () {
        primaryUiReady = true;
        maybeHideSplash();
      });
    })();
  </script>
</body>
</html>
