name: Launch verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: haneat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Backend unit tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/haneat
          SECRET_KEY: ci-secret-key-min-32-characters-long
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
        run: |
          cd backend
          python -m pytest tests/ -q

      - name: Migrate DB
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/haneat
          SECRET_KEY: ci-secret-key-min-32-characters-long
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
        run: |
          cd backend
          alembic upgrade head

      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/haneat
          SECRET_KEY: ci-secret-key-min-32-characters-long
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 5001 &
          sleep 5
          curl -sf http://127.0.0.1:5001/health

      - name: Launch verify
        run: ./scripts/verify_launch.sh http://127.0.0.1:5001
