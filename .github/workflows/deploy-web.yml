name: Deploy Web (haneat.app)

on:
  workflow_dispatch:
    inputs:
      prebuilt_tag:
        description: 'Deploy tarball from GitHub release (skip build), e.g. web-deploy-latest'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'scripts/build_web_release.sh'
      - 'scripts/patch_web_cache_bust.sh'
      - 'scripts/generate_web_pwa_icons.py'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Pillow (PWA icons)
        run: pip install Pillow

      - name: Build web release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prebuilt_tag == '' }}
        run: ./scripts/build_web_release.sh
        env:
          HANEAT_API_BASE: https://api.haneat.app

      - name: Download prebuilt web tarball
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prebuilt_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.prebuilt_tag }}" -R "${{ github.repository }}" -p 'haneat-web.tgz' -D /tmp
          mkdir -p build
          tar xzf /tmp/haneat-web.tgz -C build
          test -f build/web/index.html

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 89.19.216.60 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to Timeweb
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            build/web/ \
            root@89.19.216.60:/var/www/haneat-web/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@89.19.216.60 \
            "chown -R www-data:www-data /var/www/haneat-web 2>/dev/null || true; \
             if [[ -f /etc/nginx/sites-available/haneat-web ]] && ! grep -q 'location \^~ /icons/' /etc/nginx/sites-available/haneat-web; then \
               python3 -c \"from pathlib import Path; p=Path('/etc/nginx/sites-available/haneat-web'); t=p.read_text(); b='    location ^~ /icons/ {\\n        add_header Cache-Control \\\"no-cache, must-revalidate\\\";\\n        try_files \\\$uri =404;\\n    }\\n\\n'; t=t.replace('    location = /main.dart.js {', b+'    location = /main.dart.js {') if 'location ^~ /icons/' not in t else t; p.write_text(t)\"; \
               nginx -t && systemctl reload nginx; \
             fi"

      - name: Smoke
        run: |
          curl -sf https://haneat.app/version.json
          curl -sfI https://haneat.app/flutter_bootstrap.js | grep -i cache-control
