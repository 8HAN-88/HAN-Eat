name: Deploy Web (haneat.app)

on:
  workflow_dispatch:
    inputs:
      prebuilt_tag:
        description: 'Deploy tarball from GitHub release (skip build), e.g. web-deploy-latest'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'scripts/build_web_release.sh'
      - 'scripts/patch_web_cache_bust.sh'
      - 'scripts/patch_nginx_web_api_proxy.sh'
      - 'scripts/setup_nginx_haneat_web.sh'
      - 'scripts/generate_web_pwa_icons.py'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Pillow (PWA icons)
        run: pip install Pillow

      - name: Build web release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.prebuilt_tag == '' }}
        run: |
          ./scripts/build_web_release.sh https://api.haneat.app social
          rm -rf build/web-social
          mv build/web build/web-social

          ./scripts/build_web_release.sh https://api.haneat.app kitchen
          rm -rf build/web-kitchen
          mv build/web build/web-kitchen

          mkdir -p build/web
          cp -R build/web-social/. build/web/
        env:
          HANEAT_API_BASE: https://api.haneat.app

      - name: Download prebuilt web tarball
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prebuilt_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.prebuilt_tag }}" -R "${{ github.repository }}" -p 'haneat-web.tgz' -D /tmp
          mkdir -p build
          tar xzf /tmp/haneat-web.tgz -C build
          test -f build/web/index.html

      - name: Verify web build artifacts
        run: |
          python3 scripts/check_web_build_artifacts.py
          if [ -d build/web-kitchen ]; then
            rm -rf /tmp/haneat-social-build
            mv build/web /tmp/haneat-social-build
            cp -R build/web-kitchen build/web
            python3 scripts/check_web_build_artifacts.py
            rm -rf build/web
            mv /tmp/haneat-social-build build/web
          fi
        env:
          HANEAT_API_BASE: https://api.haneat.app

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 89.19.216.60 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to Timeweb
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            build/web/ \
            root@89.19.216.60:/var/www/haneat-web/
          if [ -d build/web-kitchen ]; then
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
              build/web-kitchen/ \
              root@89.19.216.60:/var/www/haneat-kitchen-web/
          fi
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@89.19.216.60 \
            "chown -R www-data:www-data /var/www/haneat-web /var/www/haneat-kitchen-web 2>/dev/null || true"

      - name: Patch nginx (same-origin API for Safari Web)
        continue-on-error: true
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            scripts/patch_nginx_web_api_proxy.sh \
            root@89.19.216.60:/tmp/patch_nginx_web_api_proxy.sh
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            root@89.19.216.60 \
            "bash /tmp/patch_nginx_web_api_proxy.sh"

      - name: Smoke
        run: |
          curl -sf https://haneat.app/version.json
          curl -sf https://haneat.app/health | grep -q '"status"'
          curl -sf https://haneat.app/api/v1/system/readiness | grep -q '"app_env"'
          curl -sfI https://haneat.app/flutter_bootstrap.js | grep -i cache-control
          curl -sfI https://haneat.app/assets/AssetManifest.bin.json | grep -i cache-control | grep -qi no-cache
